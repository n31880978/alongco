name: Scheduled jobs

# Vercel Cron on the Hobby plan is capped at once-per-day invocation. The
# project is on Hobby, and vercel.json's crons were changed to `0 0 * * *`
# (daily) for both jobs to get past that cap and unblock deployment — see
# commit ebbdf79. That satisfies Vercel, but not the product: expire-holds
# only mattering once every 24 hours means a slot can stay wrongly held for
# most of a day after its 10-minute hold should have lapsed, which both
# CLAUDE.md §8 and the PRD §6.4 acceptance criterion ("an 11-minute-old hold
# is expired and its slot is bookable again") rule out.
#
# This workflow is what actually keeps the two jobs on their real schedule. It
# does no work itself — it only carries CRON_SECRET to the same
# /api/cron/* routes Vercel Cron would have called, over plain HTTPS. Nothing
# here needs the Vercel plan to change.
#
# vercel.json's daily crons are left in place as a redundant backup: if this
# workflow has an outage, the worst case is a same-day catch-up instead of a
# silent multi-day gap.

on:
  schedule:
    # Every 5 minutes, not every 1: GitHub's own docs say scheduled workflows
    # can be delayed under load and explicitly discourage exactly-every-minute
    # schedules. Five minutes is the shortest interval GitHub treats as
    # reliable, and it is still a small fraction of the 10-minute hold TTL.
    - cron: '*/5 * * * *'
    # Hourly, on the hour.
    - cron: '0 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button, for testing this itself

jobs:
  expire-holds:
    # Only the 5-minute trigger runs this job — cron.schedule[0]. GitHub
    # exposes which schedule fired in github.event.schedule.
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Expire stale holds
        run: |
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://alongco.com/api/cron/expire-holds")
          cat /tmp/body
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::expire-holds returned HTTP $status"
            exit 1
          fi

  complete-bookings:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mark finished bookings complete
        run: |
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://alongco.com/api/cron/complete-bookings")
          cat /tmp/body
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::complete-bookings returned HTTP $status"
            exit 1
          fi
